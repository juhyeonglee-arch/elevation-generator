name: 윈도우 묶음

# v로 시작하는 태그(예: v0.9)를 올리면: 시험 → 윈도우 묶음 빌드·실행 확인 → Releases에 zip 올리기
# 손으로 돌리면(Run workflow) 묶음만 만들어 산출물로 남긴다.
# packaging/ 을 고친 PR에서도 묶음을 만들어 확인한다.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["packaging/**", "requirements.txt", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: 윈도우 묶음 빌드
    needs: test
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PY_VERSION: "3.12.10"
    outputs:
      name: ${{ steps.pack.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: native-raster
          path: elevation_ai
      - name: 옮겨 쓸 수 있는 파이썬 받기(nuget)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/python/$env:PY_VERSION" -OutFile py.zip
          Expand-Archive py.zip -DestinationPath pynuget
      - name: 버전 이름
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "v=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT";
          else echo "v=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - name: 묶기
        id: pack
        run: python packaging/build_windows.py --python pynuget/tools --version ${{ steps.ver.outputs.v }} --out dist
      - name: 묶음으로 실제 실행해 보기
        shell: bash
        run: |
          STAGE="${{ steps.pack.outputs.stage }}"
          PY="$STAGE/python/python.exe"
          mkdir -p smoke && cd smoke
          export PYTHONNOUSERSITE=1 USERPROFILE="$PWD/home" HOME="$PWD/home"
          "$PY" -s -c "import sys; print(sys.version); from elevation_ai import raster; raster._load(); print('raster', raster.BACKEND); assert raster.BACKEND == 'c'"
          "$PY" -s ../tests/make_sample_model.py sample_site.3dm
          "$PY" -s -m elevation_ai sample_site.3dm --scale 200 --views 남측입면 | tee run.log
          grep -q "결과:" run.log
          find home -name "*.png" | head
          test -n "$(find home -name '남측입면_1-200.png')"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: ${{ steps.pack.outputs.zip }}
          retention-days: 14
          compression-level: 0

  release:
    name: Releases에 올리기
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-bundle
          path: dist
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "입면도 자동 생성 $GITHUB_REF_NAME" \
            --notes "윈도우용: zip을 받아 '모두 압축 풀기' 한 뒤 「입면도 실행.bat」을 더블클릭하세요. 파이썬 설치는 필요 없어요. 자동 시험(Windows·Linux)을 통과한 소스로 만든 묶음입니다."
